[project]
name = "pyf5"
version = "0.1.0"
description = "Read-only Python SDK for F5 BIG-IP analysis"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "typing-extensions>=4.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
